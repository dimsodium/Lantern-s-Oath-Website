<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · Lantern's Oath</title>
    <meta name="theme-color" content="#02040a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="bg-stars" aria-hidden="true"></canvas>
    <div class="auth-wrap">
      <div class="card auth-card">
        <h1>Take the Oath</h1>
        <p class="sub">Sign in to begin your trial.</p>

        <div class="notice" id="dev-notice" hidden>
          Firebase isn't configured yet (no <code>VITE_FIREBASE_*</code> variables), so sign-in is turned off.
          You can still test the game as a guest; progress is saved in this browser only.
          <div style="margin-top:10px"><button class="btn btn-primary" id="guest-btn" type="button">Play as guest</button></div>
        </div>

        <div id="auth-ui">
          <div class="tabs" role="tablist">
            <button type="button" role="tab" aria-selected="true" data-mode="signin">Sign in</button>
            <button type="button" role="tab" aria-selected="false" data-mode="signup">Create account</button>
          </div>
          <form id="auth-form" novalidate>
            <div class="field" id="name-field" hidden>
              <label for="name">Warden name (shown on the leaderboard)</label>
              <input id="name" name="name" maxlength="24" autocomplete="nickname" />
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="email" required />
            </div>
            <div class="field">
              <label for="password">Password</label>
              <input id="password" name="password" type="password" autocomplete="current-password" minlength="6" required />
            </div>
            <div class="msg" id="msg" role="status" aria-live="polite"></div>
            <button class="btn btn-primary" type="submit" id="submit-btn">Sign in</button>
          </form>
          <div style="text-align:right;margin-top:10px"><button class="linkbtn" type="button" id="forgot-btn">Forgot password?</button></div>
          <div class="divider">or</div>
          <button class="btn" type="button" id="google-btn">
            <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
            Continue with Google
          </button>
        </div>
        <a class="back" href="/">← Back to home</a>
      </div>
    </div>
    <script type="module" src="/src/login.js"></script>
  </body>
</html>
